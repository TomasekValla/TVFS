<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Check | TomasekValla Filestream System</title>
    <link rel="icon" type="image/x-icon" href="/icon.png">
     <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap');
 
        :root {
            --bg-color: #0f0c19;
            --bg-gradient: radial-gradient(circle at top right, #1a162e 0%, #09090b 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-blur: 24px;
            --text-main: #ffffff;
            --text-secondary: #8b8b9e;
            --accent-primary: #a29bfe;
            --accent-secondary: #55efc4;
            --accent-gradient: linear-gradient(135deg, #6c5ce7 0%, #00b894 100%);
            --input-bg: rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --kanji-color: rgba(255, 255, 255, 0.02);
            --status-good: #55efc4;
            --status-warn: #ffeaa7;
            --status-bad: #ff7675;
            --tag-video: rgba(108, 92, 231, 0.25);
            --tag-audio: rgba(85, 239, 196, 0.2);
            --tag-neutral: rgba(255, 255, 255, 0.07);
        }
 
        .light-mode {
            --bg-color: #f4f6f8;
            --bg-gradient: radial-gradient(circle at top left, #ffffff 0%, #eef2f5 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.04);
            --text-main: #1e1e24;
            --text-secondary: #636e72;
            --accent-primary: #6c5ce7;
            --accent-secondary: #00b894;
            --input-bg: rgba(255, 255, 255, 0.8);
            --shadow-xl: 0 20px 40px -10px rgba(108, 92, 231, 0.1);
            --kanji-color: rgba(0, 0, 0, 0.02);
            --tag-video: rgba(108, 92, 231, 0.12);
            --tag-audio: rgba(0, 184, 148, 0.12);
            --tag-neutral: rgba(0, 0, 0, 0.05);
        }
 
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
 
        html { height: 100%; width: 100%; background-color: var(--bg-color); overflow: hidden; }
 
        body {
            background: var(--bg-gradient);
            background-color: var(--bg-color);
            background-attachment: fixed;
            background-size: cover;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 0;
        }
 
        .kanji-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120vh;
            line-height: 1;
            font-weight: 900;
            color: var(--kanji-color);
            pointer-events: none;
            z-index: -1;
            white-space: nowrap;
            user-select: none;
            letter-spacing: -5vw;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw; height: 100vh;
        }
 
        .ambient-glow {
            position: fixed;
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, var(--accent-primary) 0%, transparent 70%);
            opacity: 0.08;
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }
        .glow-1 { top: -20%; left: -10%; }
        .glow-2 { bottom: -20%; right: -10%; background: radial-gradient(circle, var(--accent-secondary) 0%, transparent 70%); }
 
        .container {
            position: relative; z-index: 10;
            width: 100%; max-width: 600px;
            padding: 20px; margin: auto;
        }
 
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: var(--shadow-xl);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
 
        .header { display: flex; justify-content: space-between; align-items: center; }
 
        h1 {
            color: var(--text-main); font-size: 1.5rem;
            font-weight: 800; letter-spacing: -0.03em; line-height: 1.2;
        }
        h1 .brand { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
 
        .header-right { display: flex; align-items: center; gap: 8px; }
 
        .nav-link {
            font-size: 0.7rem; font-weight: 600; color: var(--text-secondary);
            text-decoration: none; padding: 6px 10px; border-radius: 10px;
            border: 1px solid var(--glass-border); background: transparent;
        }
        .nav-link:hover { color: var(--accent-secondary); border-color: var(--accent-secondary); }
 
        .theme-toggle {
            background: transparent; border: none; cursor: pointer;
            color: var(--text-secondary); font-size: 1.2rem;
            padding: 8px; border-radius: 50%;
        }
        .theme-toggle:hover { color: var(--text-main); background: var(--glass-border); }
 
        .subtitle {
            font-size: 0.8rem; color: var(--text-secondary);
            line-height: 1.5; margin-top: -12px;
        }
 
        .input-row { display: flex; gap: 10px; }
 
        .url-input {
            flex: 1; padding: 16px;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
        }
        .url-input:focus { background: var(--glass-border); border-color: var(--accent-primary); }
        .url-input::placeholder { color: var(--text-secondary); opacity: 0.5; font-family: 'Inter', sans-serif; }
 
        .probe-btn {
            padding: 16px 24px;
            background: var(--accent-gradient);
            border: none; border-radius: 16px;
            color: #fff; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; letter-spacing: 0.02em;
            box-shadow: 0 10px 20px -5px rgba(108, 92, 231, 0.4);
            white-space: nowrap;
        }
        .probe-btn:hover { transform: translateY(-1px); box-shadow: 0 15px 25px -5px rgba(108, 92, 231, 0.5); }
        .probe-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
 
        /* Results */
        .results { display: none; flex-direction: column; gap: 16px; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
 
        .section-label {
            font-size: 0.6rem; text-transform: uppercase;
            letter-spacing: 0.12em; font-weight: 700;
            color: var(--text-secondary); margin-bottom: 8px;
        }
 
        .format-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
        }
        .light-mode .format-card { background: rgba(255,255,255,0.5); }
 
        .format-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
 
        .stat-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stat-label { font-size: 0.62rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem; color: var(--text-main); font-weight: 600;
        }
        .stat-val.accent { color: var(--accent-secondary); }
        .stat-val.dim { color: var(--text-secondary); font-size: 0.75rem; }
 
        .stream-card {
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
        }
 
        .stream-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
        }
 
        .stream-header.video { background: var(--tag-video); }
        .stream-header.audio { background: var(--tag-audio); }
        .stream-header.other { background: var(--tag-neutral); }
 
        .stream-type-badge {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; padding: 2px 8px;
            border-radius: 6px;
        }
        .stream-type-badge.video { background: rgba(108, 92, 231, 0.4); color: var(--accent-primary); }
        .stream-type-badge.audio { background: rgba(85, 239, 196, 0.3); color: var(--accent-secondary); }
        .stream-type-badge.other { background: var(--tag-neutral); color: var(--text-secondary); }
 
        .stream-codec {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem; font-weight: 600; color: var(--text-main);
        }
 
        .stream-codec-long {
            font-size: 0.7rem; color: var(--text-secondary);
        }
 
        .stream-body {
            padding: 14px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(0,0,0,0.1);
        }
        .light-mode .stream-body { background: rgba(255,255,255,0.3); }
 
        .raw-section {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
 
        .raw-toggle {
            background: none; border: none; font-family: inherit;
            font-size: 0.65rem; cursor: pointer; text-decoration: underline;
            color: var(--text-secondary); padding: 0; display: inline-block;
        }
        .raw-toggle:hover { color: var(--accent-secondary); }
 
        .raw-box {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: pre;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }
        .light-mode .raw-box { background: rgba(0,0,0,0.05); }
 
        .error-box {
            display: none;
            background: rgba(255, 118, 117, 0.1);
            border: 1px solid rgba(255, 118, 117, 0.3);
            border-radius: 16px;
            padding: 16px;
            color: var(--status-bad);
            font-size: 0.85rem;
            line-height: 1.5;
        }
 
        .spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--status-good);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
 
        .probe-btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
 
        .divider {
            height: 1px; background: var(--glass-border);
        }
 
        @media (max-width: 500px) {
            .format-grid, .stream-body { grid-template-columns: 1fr; }
            .input-row { flex-direction: column; }
            .glass-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="kanji-bg">検査</div>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="container">
        <div class="glass-card">

            <div class="header">
                <h1><span class="brand">TVFS</span> File Check</h1>
                <div class="header-right">
                    <a href="https://files.tomasekvalla.cz/upload" class="nav-link">↑ Upload</a>
                    <button class="theme-toggle" id="themeToggle">🌙</button>
                </div>
            </div>

            <p class="subtitle">Paste a files.tomasekvalla.cz link to inspect codec, bitrate, resolution, frame rate and more via ffprobe.</p>

            <div class="input-row">
                <input
                    type="text"
                    id="urlInput"
                    class="url-input"
                    placeholder="https://files.tomasekvalla.cz/files/videos/..."
                    autocomplete="off"
                    spellcheck="false"
                >
                <button class="probe-btn" id="probeBtn">
                    <div class="probe-btn-inner">
                        <div class="spinner" id="spinner"></div>
                        <span id="probeBtnText">Inspect</span>
                    </div>
                </button>
            </div>

            <div class="error-box" id="errorBox"></div>

            <div class="results" id="results">

                <div id="formatSection">
                    <div class="section-label">Container / Format</div>
                    <div class="format-card">
                        <div class="format-grid" id="formatGrid"></div>
                    </div>
                </div>

                <div class="divider"></div>

                <div id="streamsSection">
                    <div class="section-label">Streams</div>
                    <div id="streamsContainer" style="display:flex;flex-direction:column;gap:10px;"></div>
                </div>

                <div style="display:flex;justify-content:flex-end;">
                    <button class="raw-toggle" id="rawToggle">Show raw ffprobe JSON</button>
                </div>
                <div class="raw-section" id="rawSection">
                    <pre class="raw-box" id="rawBox"></pre>
                </div>

            </div>

        </div>
    </div>

    <script type="4d106aa35689294be0f36e81-text/javascript">
        // Theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeToggle').textContent = '☀️';
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
        });

        // Raw toggle
        let rawVisible = false;
        document.getElementById('rawToggle').addEventListener('click', () => {
            rawVisible = !rawVisible;
            document.getElementById('rawSection').style.display = rawVisible ? 'flex' : 'none';
            document.getElementById('rawToggle').textContent = rawVisible ? 'Hide raw ffprobe JSON' : 'Show raw ffprobe JSON';
        });

        // Paste shortcut: if user pastes anywhere, fill input
        document.addEventListener('paste', (e) => {
            const input = document.getElementById('urlInput');
            if (document.activeElement !== input) {
                const text = e.clipboardData.getData('text/plain').trim();
                if (text.startsWith('https://files.tomasekvalla.cz/')) {
                    input.value = text;
                    e.preventDefault();
                }
            }
        });

        // Enter key
        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') probe();
        });

        document.getElementById('probeBtn').addEventListener('click', probe);

        function setLoading(v) {
            document.getElementById('spinner').style.display = v ? 'block' : 'none';
            document.getElementById('probeBtnText').textContent = v ? 'Probing...' : 'Inspect';
            document.getElementById('probeBtn').disabled = v;
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.style.display = 'block';
            document.getElementById('results').style.display = 'none';
        }

        function hideError() {
            document.getElementById('errorBox').style.display = 'none';
        }

        async function probe() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            hideError();
            setLoading(true);
            document.getElementById('results').style.display = 'none';
            rawVisible = false;
            document.getElementById('rawSection').style.display = 'none';
            document.getElementById('rawToggle').textContent = 'Show raw ffprobe JSON';

            try {
                const r = await fetch('/api/probe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await r.json();
                if (!r.ok) {
                    showError(data.error || `Error ${r.status}`);
                    return;
                }
                render(data);
            } catch (e) {
                showError('Network error: ' + e.message);
            } finally {
                setLoading(false);
            }
        }

        function fmtBytes(b) {
            if (!b) return '—';
            b = parseInt(b);
            const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return (b / Math.pow(k, i)).toFixed(2) + ' ' + s[i];
        }

        function fmtDuration(s) {
            if (!s) return '—';
            s = parseFloat(s);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = (s % 60).toFixed(3);
            if (h > 0) return `${h}h ${m}m ${sec}s`;
            if (m > 0) return `${m}m ${sec}s`;
            return `${sec}s`;
        }

        function fmtBitrate(bps) {
            if (!bps) return '—';
            bps = parseInt(bps);
            if (bps >= 1_000_000) return (bps / 1_000_000).toFixed(2) + ' Mbps';
            return (bps / 1000).toFixed(0) + ' kbps';
        }

        function fmtFrameRate(fr) {
            // "30000/1001" → 29.97
            if (!fr || fr === '0/0') return '—';
            if (fr.includes('/')) {
                const [a, b] = fr.split('/').map(Number);
                if (b === 0) return '—';
                return (a / b).toFixed(3).replace(/\.?0+$/, '') + ' fps';
            }
            return fr + ' fps';
        }

        function stat(label, value, accent = false) {
            return `<div class="stat-row">
                <span class="stat-label">${label}</span>
                <span class="stat-val${accent ? ' accent' : ''}">${value || '—'}</span>
            </div>`;
        }

        function render(data) {
            // Format
            const f = data.format;
            const fg = document.getElementById('formatGrid');
            if (f) {
                fg.innerHTML = [
                    stat('Format', f.format_long_name || f.format_name, true),
                    stat('Duration', fmtDuration(f.duration), true),
                    stat('File Size', fmtBytes(f.size)),
                    stat('Overall Bitrate', fmtBitrate(f.bit_rate), true),
                    stat('Streams', f.nb_streams),
                    stat('Filename', (() => {
                        try { return new URL(f.filename).pathname.split('/').pop(); } catch { return f.filename; }
                    })()),
                ].join('');
            } else {
                fg.innerHTML = '<span style="color:var(--text-secondary);font-size:0.8rem;">No format info</span>';
            }

            // Streams
            const sc = document.getElementById('streamsContainer');
            sc.innerHTML = '';
            (data.streams || []).forEach(s => {
                const type = s.codec_type || 'unknown';
                let body = '';

                if (type === 'video') {
                    body = [
                        stat('Resolution', s.width && s.height ? `${s.width} × ${s.height}` : '—', true),
                        stat('Frame Rate', fmtFrameRate(s.r_frame_rate), true),
                        stat('Avg Frame Rate', fmtFrameRate(s.avg_frame_rate)),
                        stat('Bitrate', fmtBitrate(s.bit_rate), true),
                        stat('Pixel Format', s.pix_fmt),
                        stat('Profile', s.profile),
                        stat('Color Space', s.color_space),
                        stat('Color Range', s.color_range),
                        stat('Duration', fmtDuration(s.duration)),
                        stat('Frames', s.nb_frames),
                    ].join('');
                } else if (type === 'audio') {
                    body = [
                        stat('Sample Rate', s.sample_rate ? s.sample_rate + ' Hz' : '—', true),
                        stat('Channels', s.channels, true),
                        stat('Layout', s.channel_layout),
                        stat('Bitrate', fmtBitrate(s.bit_rate), true),
                        stat('Duration', fmtDuration(s.duration)),
                    ].join('');
                }

                sc.insertAdjacentHTML('beforeend', `
                    <div class="stream-card">
                        <div class="stream-header ${type}">
                            <span class="stream-type-badge ${type}">${type}</span>
                            <span class="stream-codec">${s.codec_name || '—'}</span>
                            <span class="stream-codec-long">${s.codec_long_name || ''}</span>
                        </div>
                        ${body ? `<div class="stream-body">${body}</div>` : ''}
                    </div>
                `);
            });

            // Raw
            document.getElementById('rawBox').textContent = JSON.stringify(data.raw, null, 2);

            document.getElementById('results').style.display = 'flex';
        }
    </script>
<script src="/cdn-cgi/scripts/7d0fa10a/cloudflare-static/rocket-loader.min.js" data-cf-settings="4d106aa35689294be0f36e81-|49" defer></script></body>
