<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVFS — Pairing Dashboard</title>
<style>
    :root{
        --bg:#111111; --card:#1a1a1a; --border:#2a2a2a; --text:#eaeaea; --muted:#9a9a9a;
        --accent:#4da3ff; --danger:#ff5d5d; --ok:#4dff8f;
    }
    *{box-sizing:border-box;}
    body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:32px 16px; }
    .wrap{ max-width:560px; margin:0 auto; }
    h1{ font-size:1.3rem; margin-bottom:4px; }
    .sub{ color:var(--muted); font-size:0.9rem; margin-bottom:24px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .field{ margin-bottom:12px; text-align:left; }
    label{ display:block; font-size:0.8rem; color:var(--muted); margin-bottom:6px; }
    input{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0d0d0d; color:var(--text); }
    button{ padding:10px 16px; border-radius:8px; border:none; background:var(--accent); color:#04101c; font-weight:600; cursor:pointer; }
    button.deny{ background:transparent; border:1px solid var(--danger); color:var(--danger); margin-left:8px; }
    button:disabled{ opacity:0.5; cursor:default; }
    .req-code{ font-size:1.6rem; font-weight:700; letter-spacing:0.2em; color:var(--accent); margin:6px 0; }
    .req-meta{ font-size:0.85rem; color:var(--muted); margin-bottom:10px; }
    .empty{ color:var(--muted); font-size:0.9rem; text-align:center; padding:24px 0; }
    .msg{ font-size:0.85rem; margin-top:10px; }
    .msg.error{ color:var(--danger); }
    .msg.ok{ color:var(--ok); }
    .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Pairing Dashboard</h1>
    <div class="sub">Approve devices trying to view your encrypted TVFS files.</div>

    <div class="card" id="loginCard">
        <div class="field"><label>TVFS username</label><input id="u" autocomplete="username"></div>
        <div class="field"><label>TVFS password</label><input id="p" type="password" autocomplete="current-password"></div>
        <button id="loginBtn">Log in</button>
        <div class="msg" id="loginMsg"></div>
    </div>

    <div id="inboxWrap" class="hidden">
        <div id="reqList"></div>
    </div>
</div>

<script>
(function(){
    const API = '/api/encrypted';
    let creds = null; // only set if we end up needing typed credentials
    let poll = null;

    const el = id => document.getElementById(id);
    const setMsg = (id, text, kind) => { const n = el(id); n.textContent = text || ''; n.className = 'msg' + (kind ? ' ' + kind : ''); };

    async function tryCookieAuth() {
        try {
            const res = await fetch(`${API}/pairing/inbox`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({})
            });
            if (!res.ok) return false;
            const data = await res.json();
            renderInbox(data.pending);
            el('loginCard').classList.add('hidden');
            el('inboxWrap').classList.remove('hidden');
            poll = setInterval(() => refreshInbox(null, null), 4000);
            return true;
        } catch (e) { return false; }
    }
    tryCookieAuth();

    el('loginBtn').onclick = async () => {
        const username = el('u').value.trim();
        const password = el('p').value;
        if (!username || !password) return setMsg('loginMsg', 'Enter both fields', 'error');
        el('loginBtn').disabled = true;
        const ok = await refreshInbox(username, password);
        el('loginBtn').disabled = false;
        if (ok) {
            creds = { username, password };
            el('loginCard').classList.add('hidden');
            el('inboxWrap').classList.remove('hidden');
            poll = setInterval(() => refreshInbox(creds.username, creds.password), 4000);
        }
    };

    async function refreshInbox(username, password) {
        try {
            const res = await fetch(`${API}/pairing/inbox`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) { setMsg('loginMsg', data.error || 'Login failed', 'error'); return false; }
            renderInbox(data.pending);
            return true;
        } catch (e) {
            setMsg('loginMsg', 'Network error', 'error');
            return false;
        }
    }

    function renderInbox(pending) {
        const list = el('reqList');
        if (!pending.length) {
            list.innerHTML = '<div class="card"><div class="empty">No pending pairing requests.</div></div>';
            return;
        }
        list.innerHTML = '';
        for (const req of pending) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="req-meta">Device of user <strong>${escapeHtml(req.viewerUsername)}</strong> — file "${escapeHtml(req.fileDisplayName)}"</div>
                <div class="req-code">${escapeHtml(req.code)}</div>
                <div class="req-meta">Confirm this code matches what the viewer sees before approving.</div>
                <button class="approve">Approve</button>
                <button class="deny">Deny</button>
                <div class="msg" data-msg></div>
            `;
            card.querySelector('.approve').onclick = () => decide(req, true, card);
            card.querySelector('.deny').onclick = () => decide(req, false, card);
            list.appendChild(card);
        }
    }

    async function decide(req, approve, card) {
        const msgEl = card.querySelector('[data-msg]');
        const body = creds
            ? { username: creds.username, password: creds.password, code: req.code, approve }
            : { code: req.code, approve }; // no typed creds — server falls back to the tvfs_token cookie
        try {
            const res = await fetch(`${API}/pairing/${req.requestId}/decide`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!res.ok) { msgEl.textContent = data.error || 'Failed'; msgEl.className = 'msg error'; return; }
            msgEl.textContent = approve ? 'Approved' : 'Denied';
            msgEl.className = 'msg ok';
            setTimeout(() => refreshInbox(creds ? creds.username : null, creds ? creds.password : null), 800);
        } catch (e) {
            msgEl.textContent = 'Network error';
            msgEl.className = 'msg error';
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
})();
</script>
</body>
</html>
