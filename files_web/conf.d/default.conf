server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5G;
    client_body_buffer_size 256k;
    server_tokens off;

    # Security headers for every page. A location with its own add_header does not inherit these,
    # so the /files/ locations below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    # --- redirect /deskovky/ds -> /deskovky/ds/ (bez lomítka na s lomítkem) ---
    location = /deskovky/ds {
        return 301 /deskovky/ds/;
    }

    # Data files must never be served (they now live outside the web root; these stay as a second wall)
    location = /file_registry.json { return 404; }
    location ^~ /users/ { return 404; }
    location ^~ /logs/ { return 404; }
    location ^~ /conf.d/ { return 404; }
    location ^~ /nginxconf/ { return 404; }
    location = /docker-compose.yml { return 404; }
    location ~ ^/\.(?!well-known/) { return 404; }  # hidden files in the web root only (uploads may start with a dot)

    # Install scripts come from the naTiVeFS repository (one copy, signed releases)
    location = /install-linux.sh { return 302 https://raw.githubusercontent.com/TomasekValla/naTiVeFS/main/install/linux.sh; }
    location = /install-windows.ps1 { return 302 https://raw.githubusercontent.com/TomasekValla/naTiVeFS/main/install/windows.ps1; }
    location = /get/install-linux.sh { return 302 https://raw.githubusercontent.com/TomasekValla/naTiVeFS/main/install/linux.sh; }
    location = /get/install-windows.ps1 { return 302 https://raw.githubusercontent.com/TomasekValla/naTiVeFS/main/install/windows.ps1; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        client_max_body_size 5G;
        client_body_buffer_size 256k;
        proxy_pass http://172.17.0.1:14150;
        proxy_http_version 1.1;
        # --- websocket upgrade (nutné pro socket.io v moneyGame.js) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }

    # --- socket.io handshake/transport jede mimo /api/, potřebuje vlastní block ---
    location /socket.io/ {
        proxy_pass http://172.17.0.1:14150;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
    }

    # User uploads: never run as a page on this origin. The sandbox CSP applies only when such a
    # file is opened as a document; embedding it as <img>/<audio>/<video> works as before.
    location ^~ /files/download/ {
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        mirror /__tvfs_count;
        mirror_request_body off;
        try_files $uri @gone;
    }
    location ~ ^/files/(pictures|videos|audio)/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        mirror /__tvfs_count;
        mirror_request_body off;
        try_files $uri @gone;
    }

    # Generated pages (readers, players, batch and Users Only pages) and text files keep scripts
    location /files/ {
        autoindex off;
        mirror /__tvfs_count;
        mirror_request_body off;
        try_files $uri @gone;
    }

    # Statistics: every request for a stored file is mirrored here (answer ignored, short timeouts)
    location = /__tvfs_count {
        internal;
        proxy_pass http://172.17.0.1:14150/internal/count?u=$request_uri;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # A missing stored file: the backend answers 410 "expired" (with a record) or a friendly 404
    location @gone {
        rewrite ^ /internal/gone$request_uri? break;
        proxy_pass http://172.17.0.1:14150;
        proxy_set_header Host $host;
        proxy_intercept_errors off;
    }

    # Only a redirect to the upload page (the service worker handles the real share); no big bodies here
    location /share-target {
        client_max_body_size 1m;
        proxy_pass http://172.17.0.1:14150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
