server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5G;
    client_body_buffer_size 256k;

    # --- redirect /deskovky/ds -> /deskovky/ds/ (bez lomítka na s lomítkem) ---
    location = /deskovky/ds {
        return 301 /deskovky/ds/;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /api/ {
        client_max_body_size 5G;
        client_body_buffer_size 256k;
        proxy_pass http://172.17.0.1:14150;
        proxy_http_version 1.1;
        # --- websocket upgrade (nutné pro socket.io v moneyGame.js) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }

    # --- socket.io handshake/transport jede mimo /api/, potřebuje vlastní block ---
    location /socket.io/ {
        proxy_pass http://172.17.0.1:14150;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
    }

    location /files/download/ {
        alias /usr/share/nginx/html/files/download/;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location /files/ {
        try_files $uri =404;
    }

    location /files/batch/ {
        alias /usr/share/nginx/html/files/batch/;
        autoindex off;
        try_files $uri =404;
    }

    location /share-target {
        proxy_pass http://172.17.0.1:14150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}